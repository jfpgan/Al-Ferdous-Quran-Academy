# Plain HTML/CSS/JS site. Publish directory = repository root.
# The build step writes js/cms-config.js from your Netlify environment variables
# (SUPABASE_URL and SUPABASE_ANON_KEY: the PUBLIC publishable key only). Without them the site works from its built-in content.
[build]
  command = "node scripts/make-config.js"
  publish = "."

# Setup/developer files stay off the public website
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/SETUP-BN.md"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/js/cms-config.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/content/content.js"
  [headers.values]
    Cache-Control = "no-cache"
